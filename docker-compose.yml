version: '3.8'

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentmatch-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_PATH=/app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
    restart: unless-stopped

volumes:
  chroma_data:
